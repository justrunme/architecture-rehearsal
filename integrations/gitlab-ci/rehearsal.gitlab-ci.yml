# Example GitLab CI job — include from your pipeline.
# Reference job — build from source until GHCR publish exists.
architecture-rehearsal:
  image: golang:1.26
  stage: test
  script:
    - go install github.com/justrunme/architecture-rehearsal/cmd/rehearsal@v0.3.0
    - rehearsal analyze --baseline "$BASELINE" --change "$CHANGE" --out evidence --quiet
  artifacts:
    when: always
    paths:
      - evidence/
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
