# Example GitHub Actions workflow — copy into your app repo as needed.
name: architecture-rehearsal
on:
  pull_request:
    paths:
      - "deploy/**"
      - "helm/**"
      - "infra/**"

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze change
        uses: justrunme/architecture-rehearsal/integrations/github-actions@v1.0.0
        with:
          baseline: deploy/baseline.json
          change: deploy/change.json
          out: evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-evidence
          path: evidence/
