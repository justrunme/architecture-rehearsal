name: Architecture Rehearsal Analyze
description: Gate infrastructure changes with deterministic blast-radius analysis
inputs:
  baseline:
    description: Path to baseline ArchitectureSnapshot JSON
    required: true
  change:
    description: Path to ChangeEnvelope JSON
    required: true
  out:
    description: Evidence output directory
    required: false
    default: out
# Reference composite action — builds from source (image publish not yet in CI).
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26.x"
    - shell: bash
      run: |
        set -euo pipefail
        go install github.com/justrunme/architecture-rehearsal/cmd/rehearsal@v0.3.0 || {
          git clone --depth 1 --branch v0.3.0 https://github.com/justrunme/architecture-rehearsal.git /tmp/ar
          (cd /tmp/ar && go build -o "$GITHUB_WORKSPACE/rehearsal" ./cmd/rehearsal)
          export PATH="$GITHUB_WORKSPACE:$PATH"
        }
        rehearsal analyze \
          --baseline "${{ inputs.baseline }}" \
          --change "${{ inputs.change }}" \
          --out "${{ inputs.out }}" \
          --quiet
