apiVersion: apps/v1
kind: Deployment
metadata:
  name: heavy-api
  namespace: risky
  labels:
    app: heavy-api
spec:
  replicas: 8
  selector:
    matchLabels:
      app: heavy-api
  strategy:
    rollingUpdate:
      maxSurge: "4"
  template:
    metadata:
      labels:
        app: heavy-api
    spec:
      # Matches zero kind nodes → scheduling-capacity BLOCK (affinity/nodeSelector).
      nodeSelector:
        e2e.rehearsal.io/no-such-node: "true"
      containers:
        - name: api
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
