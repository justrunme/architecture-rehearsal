apiVersion: v1
kind: ConfigMap
metadata:
  name: rehearsal-argo-presync-desired
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
data:
  app.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: demo-api
      labels:
        app: demo-api
        e2e.rehearsal.io/scenario: safe
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: demo-api
      template:
        metadata:
          labels:
            app: demo-api
        spec:
          containers:
            - name: api
              image: registry.k8s.io/pause:3.9
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
