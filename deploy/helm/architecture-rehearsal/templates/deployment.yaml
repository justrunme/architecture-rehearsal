apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "architecture-rehearsal.fullname" . }}
  labels:
    app.kubernetes.io/name: architecture-rehearsal
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: architecture-rehearsal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: architecture-rehearsal
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "architecture-rehearsal.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --addr
            - ":8080"
            - --workdir
            - {{ .Values.api.workDir | default "/var/lib/rehearsal" | quote }}
            - --db
            - {{ printf "%s/rehearsal.db" (.Values.api.workDir | default "/var/lib/rehearsal") | quote }}
            - --blob
            - {{ printf "%s/blobs" (.Values.api.workDir | default "/var/lib/rehearsal") | quote }}
            {{- if .Values.api.async }}
            - --async
            - --workers
            - {{ .Values.api.workers | default 1 | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REHEARSAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.api.existingSecret }}{{ .Values.api.existingSecret }}{{ else }}{{ include "architecture-rehearsal.fullname" . }}-api{{ end }}
                  key: {{ .Values.api.existingSecretKey | default "token" }}
                  optional: false
            - name: REHEARSAL_API_ORG
              value: {{ .Values.api.org | default "default" | quote }}
            - name: REHEARSAL_API_ROLE
              value: {{ .Values.api.role | default "platform-admin" | quote }}
            {{- if and .Values.postgresql.enabled .Values.postgresql.host }}
            - name: REHEARSAL_DATABASE_URL
              value: {{ printf "postgres://%s/%s" .Values.postgresql.host .Values.postgresql.database | quote }}
            {{- end }}
            # OIDC stub intentionally NOT wired — unsigned JWT acceptance was removed in v1.0.1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.api.workDir | default "/var/lib/rehearsal" | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          emptyDir: {}
