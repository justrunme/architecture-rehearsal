{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "architecture-rehearsal.fullname" . }}
  labels:
    app.kubernetes.io/name: architecture-rehearsal
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: architecture-rehearsal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.ingressRules }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    {{- with .Values.networkPolicy.egressRules }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    {{- end }}
{{- end }}
