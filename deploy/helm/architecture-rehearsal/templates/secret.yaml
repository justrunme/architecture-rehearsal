apiVersion: v1
kind: Secret
metadata:
  name: {{ include "architecture-rehearsal.fullname" . }}-api
  labels:
    app.kubernetes.io/name: architecture-rehearsal
type: Opaque
stringData:
  {{- if .Values.api.token }}
  token: {{ .Values.api.token | quote }}
  {{- else if .Values.api.existingSecret }}
  # token provided by existingSecret — this secret is a stub and should not be used
  token: "REPLACE-ME"
  {{- else }}
  {{- fail "api.token is required (or set api.existingSecret and wire env manually). Refusing to deploy with default local-dev credentials." }}
  {{- end }}
