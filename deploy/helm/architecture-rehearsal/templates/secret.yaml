{{- if and (not .Values.api.existingSecret) .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "architecture-rehearsal.fullname" . }}-api
  labels:
    app.kubernetes.io/name: architecture-rehearsal
type: Opaque
stringData:
  {{- if .Values.api.token }}
  token: {{ .Values.api.token | quote }}
  {{- else }}
  {{- fail "api.token is required (or set api.existingSecret). Refusing to deploy with empty credentials." }}
  {{- end }}
{{- end }}
