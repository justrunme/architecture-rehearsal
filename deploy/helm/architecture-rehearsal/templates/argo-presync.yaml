{{- if .Values.argoPresync.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "architecture-rehearsal.fullname" . }}-argo-presync
  labels:
    app.kubernetes.io/name: {{ include "architecture-rehearsal.fullname" . }}
    app.kubernetes.io/component: argo-presync-gate
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "architecture-rehearsal.fullname" . }}-argo-presync
  labels:
    app.kubernetes.io/name: {{ include "architecture-rehearsal.fullname" . }}
    app.kubernetes.io/component: argo-presync-gate
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "persistentvolumeclaims", "persistentvolumes", "events", "endpoints", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "architecture-rehearsal.fullname" . }}-argo-presync
  labels:
    app.kubernetes.io/name: {{ include "architecture-rehearsal.fullname" . }}
    app.kubernetes.io/component: argo-presync-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "architecture-rehearsal.fullname" . }}-argo-presync
subjects:
  - kind: ServiceAccount
    name: {{ include "architecture-rehearsal.fullname" . }}-argo-presync
    namespace: {{ .Release.Namespace }}
{{- if .Values.argoPresync.includeHookJob }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "architecture-rehearsal.fullname" . }}-argo-presync
  labels:
    app.kubernetes.io/name: {{ include "architecture-rehearsal.fullname" . }}
    app.kubernetes.io/component: argo-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "architecture-rehearsal.fullname" . }}
        app.kubernetes.io/component: argo-presync-gate
    spec:
      serviceAccountName: {{ include "architecture-rehearsal.fullname" . }}-argo-presync
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gate
          image: "{{ .Values.argoPresync.image.repository }}:{{ .Values.argoPresync.image.tag }}"
          imagePullPolicy: {{ .Values.argoPresync.image.pullPolicy }}
          args:
            - argo-presync
            - --desired-dir=/gate/desired
            - --live
            - --out=/tmp/argo-presync
            - --timeout={{ .Values.argoPresync.timeout }}
          env:
            - name: HOME
              value: /tmp
            - name: ARGOCD_APP_NAME
              value: {{ .Values.argoPresync.appName | default "" | quote }}
            - name: ARGOCD_APP_NAMESPACE
              value: {{ .Values.argoPresync.appNamespace | default "argocd" | quote }}
          resources:
            {{- toYaml .Values.argoPresync.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: desired
              mountPath: /gate/desired
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: desired
          configMap:
            name: {{ .Values.argoPresync.desiredConfigMap }}
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
