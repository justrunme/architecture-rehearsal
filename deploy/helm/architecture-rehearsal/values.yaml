replicaCount: 1

image:
  repository: ghcr.io/justrunme/architecture-rehearsal
  tag: "1.2.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

api:
  enabled: true
  # REQUIRED: set a strong token (or use existingSecret). Chart fails without it.
  # helm upgrade ... --set api.token=$(openssl rand -hex 32)
  token: ""
  existingSecret: ""
  existingSecretKey: token
  org: default
  role: platform-admin
  workDir: /var/lib/rehearsal
  async: true
  workers: 2

# Durable storage for SQLite + blobs (v1.2.1+). emptyDir is NOT durable.
persistence:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClass: ""
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

objectStorage:
  enabled: false
  endpoint: ""
  bucket: rehearsal-evidence

# When enabled, REHEARSAL_DATABASE_URL is set and --db sqlite is omitted.
postgresql:
  enabled: false
  host: ""
  database: rehearsal

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
