replicaCount: 1

image:
  repository: ghcr.io/justrunme/architecture-rehearsal
  tag: "1.5.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

api:
  enabled: true
  # REQUIRED: set a strong token (or use existingSecret). Chart fails without it.
  # helm upgrade ... --set api.token=$(openssl rand -hex 32)
  token: ""
  existingSecret: ""
  existingSecretKey: token
  org: default
  role: platform-admin
  workDir: /var/lib/rehearsal
  async: true
  workers: 2

# Durable storage for SQLite + blobs (v1.2.1+). emptyDir is NOT durable.
persistence:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClass: ""
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

objectStorage:
  enabled: false
  endpoint: ""
  bucket: rehearsal-evidence

# When enabled, REHEARSAL_DATABASE_URL is set and --db sqlite is omitted.
postgresql:
  enabled: false
  host: ""
  database: rehearsal

# controller-runtime operator (v1.5.1). API URL is deployment-only (no CR override).
operator:
  enabled: false
  replicas: 2
  leaderElection: true
  image:
    repository: ghcr.io/justrunme/architecture-rehearsal-operator
    tag: "1.5.1"
    pullPolicy: IfNotPresent
  # controlPlaneURL is the in-cluster URL set on the operator Deployment only.
  # Never expose this as a CR field.
  controlPlaneURL: "" # empty → http://{{fullname}}:{{service.port}}
  existingSecret: "" # empty → use chart api secret
  networkPolicy:
    enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
