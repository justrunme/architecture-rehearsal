# Standalone operator manifests (also available via Helm operator.enabled).
# REHEARSAL_API_URL is deployment-only — never from CR.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rehearsal-operator
  labels:
    app.kubernetes.io/name: rehearsal-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rehearsal-operator
rules:
  - apiGroups: [rehearsal.io]
    resources: [rehearsalruns]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rehearsal.io]
    resources: [rehearsalruns/status]
    verbs: [get, update, patch]
  - apiGroups: [rehearsal.io]
    resources: [rehearsalruns/finalizers]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rehearsal-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rehearsal-operator
subjects:
  - kind: ServiceAccount
    name: rehearsal-operator
    namespace: default # override when installing
---
apiVersion: v1
kind: Secret
metadata:
  name: rehearsal-operator-token
type: Opaque
stringData:
  token: "CHANGE_ME" # helm sets this; never commit real secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rehearsal-operator
  labels:
    app.kubernetes.io/name: rehearsal-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rehearsal-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rehearsal-operator
    spec:
      serviceAccountName: rehearsal-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/justrunme/architecture-rehearsal-operator:1.5.1
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=false
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8082
          env:
            - name: REHEARSAL_API_URL
              value: http://architecture-rehearsal:8080 # in-cluster control plane Service
            - name: REHEARSAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rehearsal-operator-token
                  key: token
          ports:
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
# Restrict operator egress to DNS + control plane only (adjust namespace/name).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rehearsal-operator-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rehearsal-operator
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: architecture-rehearsal
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
