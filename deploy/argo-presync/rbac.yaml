# Default PreSync RBAC: namespaced Role + RoleBinding.
# Workload kinds need patch for kubectl apply --dry-run=server (dryRun=All only;
# dry-run does not mutate objects — resourceVersion unchanged; verified on kind).
# Cluster-scoped reads (nodes, namespaces, PVs) and Applications require the
# optional ClusterRole in rbac-cluster.yaml (Helm: argoPresync.clusterRBAC=true).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
  name: rehearsal-argo-presync
  labels:
    app.kubernetes.io/name: rehearsal-argo-presync
    app.kubernetes.io/component: argo-presync-gate
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "events", "endpoints", "serviceaccounts", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
  name: rehearsal-argo-presync
  labels:
    app.kubernetes.io/name: rehearsal-argo-presync
    app.kubernetes.io/component: argo-presync-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rehearsal-argo-presync
subjects:
  - kind: ServiceAccount
    name: rehearsal-argo-presync
    namespace: default # set to Application destination namespace
