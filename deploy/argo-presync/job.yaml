# PreSync Job: fails closed (non-zero) on BLOCK/UNKNOWN so Argo aborts the sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: rehearsal-argo-presync
  labels:
    app.kubernetes.io/name: rehearsal-argo-presync
    app.kubernetes.io/component: argo-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rehearsal-argo-presync
        app.kubernetes.io/component: argo-presync-gate
    spec:
      serviceAccountName: rehearsal-argo-presync
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gate
          image: ghcr.io/justrunme/architecture-rehearsal-presync:1.8.0
          imagePullPolicy: IfNotPresent
          args:
            - argo-presync
            - --desired-dir=/gate/desired
            - --live
            - --out=/tmp/argo-presync
            - --timeout=90s
          env:
            - name: HOME
              value: /tmp
            - name: ARGOCD_APP_NAME
              value: ""
            - name: ARGOCD_APP_NAMESPACE
              value: argocd
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: desired
              mountPath: /gate/desired
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: desired
          configMap:
            name: rehearsal-argo-presync-desired
        - name: tmp
          emptyDir: {}
