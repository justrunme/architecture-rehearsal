# Default PreSync RBAC (namespaced, hook-scoped):
#   Role + RoleBinding for inventory + patch (dryRun=All)
# Cluster-scoped Nodes/Pods reads live in rbac-nodes.yaml (NOT PreSync hooks)
# so AppProjects need not whitelist ClusterRole/Binding in hooks.
# Optional Applications / namespaces / PVs: see rbac-cluster.yaml (Helm clusterRBAC).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
  name: rehearsal-argo-presync
  labels:
    app.kubernetes.io/name: rehearsal-argo-presync
    app.kubernetes.io/component: argo-presync-gate
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "events", "endpoints", "serviceaccounts", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
  name: rehearsal-argo-presync
  labels:
    app.kubernetes.io/name: rehearsal-argo-presync
    app.kubernetes.io/component: argo-presync-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rehearsal-argo-presync
subjects:
  - kind: ServiceAccount
    name: rehearsal-argo-presync
    namespace: default # set to Application destination namespace
