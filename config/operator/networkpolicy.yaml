# OPTIONAL — not applied by kustomization by default.
# Enable only after setting kube API server CIDRs for your cluster.
# Without an API CIDR rule the operator cannot watch CRs / update status / elect leader.
#
# Discover apiserver endpoints:
#   kubectl get endpoints kubernetes -n default -o yaml
#   kubectl get svc kubernetes -n default -o jsonpath='{.spec.clusterIP}'
#
# kubectl apply -f networkpolicy.yaml  # after editing ipBlock below
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rehearsal-operator-egress
  labels:
    app.kubernetes.io/name: rehearsal-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rehearsal-operator
  policyTypes: [Egress]
  egress:
    # Control plane HTTP API
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: architecture-rehearsal
      ports:
        - protocol: TCP
          port: 8080
    # Kubernetes API — set your cluster CIDR(s). Never use 0.0.0.0/0.
    # Example for Kind default service IP (verify on your cluster first):
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
