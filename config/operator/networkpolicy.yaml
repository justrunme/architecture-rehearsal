# OPTIONAL — not applied by kustomization by default (breaks API watch without API CIDR).
# Enable only after setting kube API server CIDRs for your cluster.
# kubectl apply -f networkpolicy.yaml  # after editing ipBlock
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rehearsal-operator-egress
  labels:
    app.kubernetes.io/name: rehearsal-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rehearsal-operator
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: architecture-rehearsal
      ports:
        - protocol: TCP
          port: 8080
    # REPLACE with your apiserver address(es), e.g. from `kubectl get endpoints kubernetes`
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # DANGEROUS placeholder — replace with real API CIDR
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
