apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rehearsal-operator
  labels:
    app.kubernetes.io/name: rehearsal-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rehearsal-operator
subjects:
  - kind: ServiceAccount
    name: rehearsal-operator
    namespace: default # change when installing into another namespace
