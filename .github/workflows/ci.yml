name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Build
        run: go build -o bin/rehearsal ./cmd/rehearsal
      - name: Demo (expect block)
        run: bash scripts/demo.sh
      - name: E2E pipeline (dump → graph → scoped change → block → verify)
        run: bash scripts/e2e_pipeline.sh
      - name: Verify loop (golden)
        run: |
          ./bin/rehearsal analyze \
            --baseline examples/golden/rwo-node-loss/baseline.json \
            --change examples/golden/rwo-node-loss/change.json \
            --out out --quiet || true
          # analyze returns 3; still write latest-report
          test -f out/latest-report.json
          ./bin/rehearsal verify \
            --report out/latest-report.json \
            --observed examples/golden/rwo-node-loss/observed.json \
            --out out/verify.json
