name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      minio:
        image: adobe/s3mock:latest
        ports:
          - 9000:9000
        env:
          initialBuckets: rehearsal-test-bucket
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Policy (fail-closed)
        run: go test ./internal/policy/...
      - name: Race
        run: go test -race ./...
      - name: Build
        run: |
          go build -o bin/rehearsal ./cmd/rehearsal
          go build -o bin/rehearsal-operator ./cmd/rehearsal-operator
          # operator trust boundary: controlPlaneURL must not appear on Spec
          ! grep -r "ControlPlaneURL" api/v1beta1/ --include='*.go' || (echo "ControlPlaneURL must not exist on CR types" && exit 1)

      - name: Demo (expect block)
        run: bash scripts/demo.sh
      - name: E2E pipeline (dump → graph → scoped change → block → verify)
        run: bash scripts/e2e_pipeline.sh
      - name: Argo impact gate (4 scenarios, asserted)
        run: bash scripts/e2e_argo_impact.sh
      - name: Upload argo-impact e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: argo-impact-e2e
          path: out/argo-impact-e2e/
          if-no-files-found: ignore
      - name: Verify loop (golden multi-scenario)
        run: |
          set +e
          ./bin/rehearsal analyze \
            --baseline examples/golden/rwo-node-loss/baseline.json \
            --change examples/golden/rwo-node-loss/change.json \
            --out out --quiet
          code=$?
          set -e
          test "$code" -eq 3
          test -f out/latest-report.json
          ./bin/rehearsal verify \
            --report out/latest-report.json \
            --observed examples/golden/rwo-node-loss/observed.json \
            --baseline examples/golden/rwo-node-loss/baseline.json \
            --change examples/golden/rwo-node-loss/change.json \
            --out out/verify.json
          test "$(python3 -c 'import json; print(json.load(open("out/verify.json"))["outcome"])')" = "verified"
      - name: Version stamp
        run: ./bin/rehearsal version | grep -q '1.8.2'
      - name: Schemas + calibrate smoke
        run: |
          ./bin/rehearsal schemas >/dev/null
          ./bin/rehearsal calibrate --demo >/dev/null
          set +e
          ./bin/rehearsal policy --risk critical --decision block
          code=$?
          set -e
          test "$code" -eq 3
      - name: Control plane API smoke (requires explicit token)
        run: |
          export REHEARSAL_API_TOKEN="ci-test-$(openssl rand -hex 16)"
          ./bin/rehearsal serve --addr 127.0.0.1:18080 --workdir "$PWD" --async &
          pid=$!
          sleep 1
          curl -sf http://127.0.0.1:18080/healthz
          curl -sf http://127.0.0.1:18080/readyz
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer viewer-token" http://127.0.0.1:18080/v1/runs)
          test "$code" = "401"
          curl -sf -H "Authorization: Bearer $REHEARSAL_API_TOKEN" http://127.0.0.1:18080/v1/version | grep -q 1.8.1
          curl -sf -H "Authorization: Bearer $REHEARSAL_API_TOKEN" http://127.0.0.1:18080/v1/metrics | grep -q rehearsal_queue_depth
          # create run + job list + audit
          curl -sf -X POST -H "Authorization: Bearer $REHEARSAL_API_TOKEN" -H "Content-Type: application/json" \
            -d '{"id":"ci-run","baselineRef":"examples/golden/rwo-node-loss/baseline.json","changeRef":"examples/golden/rwo-node-loss/change.json"}' \
            http://127.0.0.1:18080/v1/runs | grep -q ci-run
          curl -sf -H "Authorization: Bearer $REHEARSAL_API_TOKEN" "http://127.0.0.1:18080/v1/jobs?limit=10"
          curl -sf -H "Authorization: Bearer $REHEARSAL_API_TOKEN" "http://127.0.0.1:18080/v1/audit?limit=10"
          # backup smoke (serve defaults to $workdir/rehearsal.db)
          ./bin/rehearsal backup --db "$PWD/rehearsal.db" --out /tmp/rehearsal-bak.db
          test -f /tmp/rehearsal-bak.db
          kill $pid
      - name: Docker build (control plane + operator)
        run: |
          docker build -t architecture-rehearsal:ci -f Dockerfile .
          docker build -t architecture-rehearsal-operator:ci -f Dockerfile.operator .
      - name: Helm template (operator enabled)
        run: |
          if command -v helm >/dev/null; then
            helm template e2e deploy/helm/architecture-rehearsal \
              --set api.token=ci-token \
              --set operator.enabled=true \
              --set operator.leaderElection=true >/tmp/helm-out.yaml
            grep -q REHEARSAL_API_URL /tmp/helm-out.yaml
            test -f deploy/helm/architecture-rehearsal/crds/rehearsal.io_rehearsalruns.yaml
            ! grep -E 'controlPlaneURL:' config/crd/rehearsal.io_rehearsalruns.yaml
            ! grep -r 'ControlPlaneURL' api/v1beta1/ --include='*.go'
          else
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm template e2e deploy/helm/architecture-rehearsal \
              --set api.token=ci-token \
              --set operator.enabled=true >/tmp/helm-out.yaml
            grep -q REHEARSAL_API_URL /tmp/helm-out.yaml
            test -f deploy/helm/architecture-rehearsal/crds/rehearsal.io_rehearsalruns.yaml
          fi

  operator-kind-e2e:
    runs-on: ubuntu-latest
    # Helm install + full operator lifecycle + terminal evidence; ~10–15 min
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version
      - name: Kind operator Helm E2E
        run: bash scripts/kind-operator-e2e.sh

  argo-kind-e2e:
    runs-on: ubuntu-latest
    # Kind + Argo CD install + native CLIFetcher + fixture scenarios
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Head SHA is on the PR branch and fetchable by Argo CD as targetRevision.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Kind Argo CD impact E2E
        run: bash scripts/kind-argo-impact-e2e.sh
      - name: Upload kind argo-impact artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kind-argo-impact-e2e
          path: out/argo-e2e/
          if-no-files-found: ignore

  argo-presync-kind-e2e:
    runs-on: ubuntu-latest
    # Kind + pinned Argo CD + real PreSync hook (safe/risky/fail-closed/break-glass)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Head SHA is on the PR/push branch and fetchable by Argo CD as targetRevision.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Kind Argo CD PreSync gate E2E
        run: bash scripts/kind-argo-presync-e2e.sh
      - name: Upload kind argo-presync artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kind-argo-presync-e2e
          path: out/argo-presync-e2e/
          if-no-files-found: ignore

  # Live template compare: apply dry-run must not false-BLOCK identical desired,
  # must BLOCK on env add/remove and Recreate+env, and shipped namespaced Role (patch) works.
  argo-rollout-template-kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Kind rollout template compare E2E
        run: bash scripts/kind-rollout-template-e2e.sh
      - name: Upload kind rollout-template artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kind-rollout-template-e2e
          path: out/rollout-template-e2e/
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rehearsal
          POSTGRES_PASSWORD: rehearsal
          POSTGRES_DB: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Postgres contract (Open + CreateRun + ClaimJob)
        env:
          REHEARSAL_DATABASE_URL: postgres://rehearsal:rehearsal@localhost:5432/rehearsal?sslmode=disable
        run: |
          go test ./internal/persist/ -count=1
          mkdir -p scripts
          cat > scripts/pg_smoke.go <<'EOF'
          //go:build ignore

          package main

          import (
          	"context"
          	"fmt"
          	"os"
          	"time"

          	"github.com/justrunme/architecture-rehearsal/internal/persist"
          	"github.com/justrunme/architecture-rehearsal/internal/run"
          )

          func main() {
          	dsn := os.Getenv("REHEARSAL_DATABASE_URL")
          	s, err := persist.Open(dsn, "")
          	if err != nil {
          		panic(err)
          	}
          	defer s.Close()
          	rr := run.NewRun("pg1", "ik-pg", run.Spec{})
          	rr.Labels = map[string]string{"org": "ci"}
          	if err := s.CreateRun(rr); err != nil {
          		panic(err)
          	}
          	if _, err := s.Enqueue(persist.JobAdvanceRun, "pg1", "ci", `{}`, "op-pg"); err != nil {
          		panic(err)
          	}
          	job, err := s.ClaimJob(context.Background(), "w", time.Minute)
          	if err != nil || job == nil {
          		panic(fmt.Sprintf("claim %v %#v", err, job))
          	}
          	if err := s.CompleteJob(job.ID, job.FenceToken); err != nil {
          		panic(err)
          	}
          	if s.SchemaVersion() < 2 {
          		panic("schema")
          	}
          	fmt.Println("postgres ok schema", s.SchemaVersion())
          }
          EOF
          go run scripts/pg_smoke.go
          go run scripts/pg_legacy_smoke.go
