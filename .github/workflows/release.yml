name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./...
      - name: Build multi-arch assets
        run: bash scripts/release-assets.sh "${GITHUB_REF_NAME#v}"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Push container images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          docker build -t "ghcr.io/${OWNER}/architecture-rehearsal:${VER}" \
            -t "ghcr.io/${OWNER}/architecture-rehearsal:latest" -f Dockerfile .
          docker build -t "ghcr.io/${OWNER}/architecture-rehearsal-operator:${VER}" \
            -t "ghcr.io/${OWNER}/architecture-rehearsal-operator:latest" -f Dockerfile.operator .
          docker push "ghcr.io/${OWNER}/architecture-rehearsal:${VER}"
          docker push "ghcr.io/${OWNER}/architecture-rehearsal:latest"
          docker push "ghcr.io/${OWNER}/architecture-rehearsal-operator:${VER}"
          docker push "ghcr.io/${OWNER}/architecture-rehearsal-operator:latest"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rehearsal-linux-amd64
            dist/rehearsal-linux-arm64
            dist/rehearsal-darwin-amd64
            dist/rehearsal-darwin-arm64
            dist/rehearsal-windows-amd64.exe
            dist/rehearsal-operator-linux-amd64
            dist/rehearsal-operator-linux-arm64
            dist/rehearsal-operator-darwin-amd64
            dist/rehearsal-operator-darwin-arm64
            dist/rehearsal-operator-windows-amd64.exe
            dist/SHA256SUMS
            dist/sbom.gomod.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
