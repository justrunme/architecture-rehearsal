name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create GitHub Release and upload release assets / SBOMs.
      contents: write
      # Push multi-arch images to GHCR.
      packages: write
      # Keyless cosign signing and provenance OIDC.
      id-token: write
      # actions/attest-build-provenance attestation upload.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./...
      - name: Build multi-arch assets
        run: bash scripts/release-assets.sh "${GITHUB_REF_NAME#v}"
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags
        id: meta
        run: |
          VER="${GITHUB_REF_NAME#v}"
          OWNER="${{ github.repository_owner }}"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "cp=ghcr.io/${OWNER}/architecture-rehearsal" >> "$GITHUB_OUTPUT"
          echo "op=ghcr.io/${OWNER}/architecture-rehearsal-operator" >> "$GITHUB_OUTPUT"
          echo "ps=ghcr.io/${OWNER}/architecture-rehearsal-presync" >> "$GITHUB_OUTPUT"
      - name: Push control plane (linux/amd64,linux/arm64)
        id: build-cp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.cp }}:${{ steps.meta.outputs.ver }}
            ${{ steps.meta.outputs.cp }}:latest
      - name: Push operator (linux/amd64,linux/arm64)
        id: build-op
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.op }}:${{ steps.meta.outputs.ver }}
            ${{ steps.meta.outputs.op }}:latest
      - name: Push presync gate (linux/amd64,linux/arm64)
        id: build-ps
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.presync
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.ps }}:${{ steps.meta.outputs.ver }}
            ${{ steps.meta.outputs.ps }}:latest
      - name: Smoke-test presync image per platform
        run: |
          set -euo pipefail
          repo="${{ steps.meta.outputs.ps }}"
          index="${repo}@${{ steps.build-ps.outputs.digest }}"
          for p in amd64 arm64; do
            # Run each platform by its own manifest digest: running a second platform of the same
            # index digest fails with "cannot overwrite digest" in Docker's containerd store.
            d=$(docker buildx imagetools inspect --raw "$index" \
              | jq -r --arg a "$p" '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$a) | .digest')
            test -n "$d"
            echo "== linux/${p} ${d}"
            docker run --rm --platform "linux/${p}" --entrypoint sh "${repo}@${d}" \
              -c 'uname -m && rehearsal version && kubectl version --client'
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/rehearsal-linux-amd64
            dist/rehearsal-linux-arm64
            dist/rehearsal-darwin-amd64
            dist/rehearsal-darwin-arm64
            dist/rehearsal-windows-amd64.exe
            dist/rehearsal-operator-linux-amd64
            dist/rehearsal-operator-linux-arm64
            dist/rehearsal-operator-darwin-amd64
            dist/rehearsal-operator-darwin-arm64
            dist/rehearsal-operator-windows-amd64.exe
            dist/SHA256SUMS
            dist/sbom.gomod.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM (control plane)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.cp }}@${{ steps.build-cp.outputs.digest }}
          format: spdx-json
          artifact-name: architecture-rehearsal-sbom.spdx.json
          output-file: architecture-rehearsal-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Generate SBOM (operator)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.op }}@${{ steps.build-op.outputs.digest }}
          format: spdx-json
          artifact-name: architecture-rehearsal-operator-sbom.spdx.json
          output-file: architecture-rehearsal-operator-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attach SPDX SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            architecture-rehearsal-sbom.spdx.json \
            architecture-rehearsal-operator-sbom.spdx.json \
            --clobber
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Attest control plane provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.cp }}
          subject-digest: ${{ steps.build-cp.outputs.digest }}
          push-to-registry: true
      - name: Attest operator provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.op }}
          subject-digest: ${{ steps.build-op.outputs.digest }}
          push-to-registry: true
      - name: Sign images
        run: |
          set -euo pipefail
          cosign sign --yes --registry-referrers-mode=legacy "${{ steps.meta.outputs.cp }}@${{ steps.build-cp.outputs.digest }}"
          cosign sign --yes --registry-referrers-mode=legacy "${{ steps.meta.outputs.op }}@${{ steps.build-op.outputs.digest }}"
          cosign sign --yes --registry-referrers-mode=legacy "${{ steps.meta.outputs.ps }}@${{ steps.build-ps.outputs.digest }}"
      - name: Verify signed images
        run: |
          set -euo pipefail
          for img in \
            "${{ steps.meta.outputs.cp }}@${{ steps.build-cp.outputs.digest }}" \
            "${{ steps.meta.outputs.op }}@${{ steps.build-op.outputs.digest }}" \
            "${{ steps.meta.outputs.ps }}@${{ steps.build-ps.outputs.digest }}"
          do
            cosign verify \
              --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              "$img"
          done
      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.22.1
      - name: Package and push Helm chart
        id: helm-push
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          OWNER="${{ github.repository_owner }}"
          CHART_REPO="ghcr.io/${OWNER}/charts"
          
          cd deploy/helm
          helm package architecture-rehearsal --version "${VER}" --app-version "${VER}"
          OUTPUT=$(helm push "architecture-rehearsal-${VER}.tgz" "oci://${CHART_REPO}")
          echo "$OUTPUT"
          
          # Extract digest from helm push output (must allow 's'/'h' in sha256:...)
          DIGEST=$(echo "$OUTPUT" | grep -oP 'Digest: \K\S+' || echo "")
          if [ -z "$DIGEST" ]; then
            echo "Failed to extract chart digest"
            exit 1
          fi
          echo "chart_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "chart_ref=${CHART_REPO}/architecture-rehearsal:${VER}" >> "$GITHUB_OUTPUT"
          echo "Chart pushed to oci://${CHART_REPO}/architecture-rehearsal:${VER}"
          echo "Chart digest: ${DIGEST}"
      - name: Sign Helm chart
        run: |
          set -euo pipefail
          CHART_REF="${{ steps.helm-push.outputs.chart_ref }}"
          CHART_DIGEST="${{ steps.helm-push.outputs.chart_digest }}"
          
          cosign sign --yes --registry-referrers-mode=legacy "${CHART_REF}@${CHART_DIGEST}"
          
          echo "Chart signed: ${CHART_REF}@${CHART_DIGEST}"
      - name: Verify signed chart
        run: |
          set -euo pipefail
          CHART_REF="${{ steps.helm-push.outputs.chart_ref }}"
          CHART_DIGEST="${{ steps.helm-push.outputs.chart_digest }}"
          
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${CHART_REF}@${CHART_DIGEST}"
          
          echo "Chart signature verified"
      - name: Install ORAS
        run: |
          set -euo pipefail
          ORAS_VERSION=1.2.2
          curl -fsSL -o /tmp/oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oras.tar.gz -C /tmp
          sudo mv /tmp/oras /usr/local/bin/oras
          rm /tmp/oras.tar.gz
          oras version
      - name: Push Artifact Hub metadata
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          CHART_REPO="ghcr.io/${OWNER}/charts/architecture-rehearsal"
          
          cd deploy/helm/architecture-rehearsal
          oras push "${CHART_REPO}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
          
          echo "Artifact Hub metadata pushed to ${CHART_REPO}:artifacthub.io"
