name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # for provenance / future OIDC attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./...
      - name: Build multi-arch assets
        run: bash scripts/release-assets.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rehearsal-linux-amd64
            dist/rehearsal-linux-arm64
            dist/rehearsal-darwin-amd64
            dist/rehearsal-darwin-arm64
            dist/rehearsal-windows-amd64.exe
            dist/SHA256SUMS
            dist/sbom.gomod.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
