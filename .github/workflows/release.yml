name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./...
      - name: Build multi-arch assets
        run: bash scripts/release-assets.sh "${GITHUB_REF_NAME#v}"
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags
        id: meta
        run: |
          VER="${GITHUB_REF_NAME#v}"
          OWNER="${{ github.repository_owner }}"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "cp=ghcr.io/${OWNER}/architecture-rehearsal" >> "$GITHUB_OUTPUT"
          echo "op=ghcr.io/${OWNER}/architecture-rehearsal-operator" >> "$GITHUB_OUTPUT"
      - name: Push control plane (linux/amd64,linux/arm64)
        id: build-cp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.cp }}:${{ steps.meta.outputs.ver }}
            ${{ steps.meta.outputs.cp }}:latest
      - name: Push operator (linux/amd64,linux/arm64)
        id: build-op
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.op }}:${{ steps.meta.outputs.ver }}
            ${{ steps.meta.outputs.op }}:latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/rehearsal-linux-amd64
            dist/rehearsal-linux-arm64
            dist/rehearsal-darwin-amd64
            dist/rehearsal-darwin-arm64
            dist/rehearsal-windows-amd64.exe
            dist/rehearsal-operator-linux-amd64
            dist/rehearsal-operator-linux-arm64
            dist/rehearsal-operator-darwin-amd64
            dist/rehearsal-operator-darwin-arm64
            dist/rehearsal-operator-windows-amd64.exe
            dist/SHA256SUMS
            dist/sbom.gomod.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM (control plane)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.cp }}@${{ steps.build-cp.outputs.digest }}
          format: spdx-json
          artifact-name: architecture-rehearsal-sbom.spdx.json
          output-file: architecture-rehearsal-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Generate SBOM (operator)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.op }}@${{ steps.build-op.outputs.digest }}
          format: spdx-json
          artifact-name: architecture-rehearsal-operator-sbom.spdx.json
          output-file: architecture-rehearsal-operator-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attach SPDX SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            architecture-rehearsal-sbom.spdx.json \
            architecture-rehearsal-operator-sbom.spdx.json \
            --clobber
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Attest control plane provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.cp }}
          subject-digest: ${{ steps.build-cp.outputs.digest }}
          push-to-registry: true
      - name: Attest operator provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.op }}
          subject-digest: ${{ steps.build-op.outputs.digest }}
          push-to-registry: true
      - name: Sign images
        run: |
          set -euo pipefail
          cosign sign --yes --registry-referrers-mode=legacy "${{ steps.meta.outputs.cp }}@${{ steps.build-cp.outputs.digest }}"
          cosign sign --yes --registry-referrers-mode=legacy "${{ steps.meta.outputs.op }}@${{ steps.build-op.outputs.digest }}"
      - name: Verify signed images
        run: |
          set -euo pipefail
          for img in \
            "${{ steps.meta.outputs.cp }}@${{ steps.build-cp.outputs.digest }}" \
            "${{ steps.meta.outputs.op }}@${{ steps.build-op.outputs.digest }}"
          do
            cosign verify \
              --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              "$img"
          done
